const CARRIER_ORDER = ['swift','usx','pam','transam','cre'];

function isFlatCategory(carrierId, cat){
  return (carrierId==='usx' && cat==='OTR Team Company') || (carrierId==='transam' && cat==='Hiring Area');
}

function money(n){ return n==null ? '?' : '$'+n.toLocaleString(); }

/* ---- SWIFT ---- */
function swiftState(cat, state){
  const rec = SWIFT_DATA[cat][state];
  if(!rec) return null;
  const payLine = `Avg pay: ${money(rec.avg_low)}–${money(rec.avg_high)}/wk (true max ${money(rec.max_high)})`;
  return {
    value: rec.avg_high,
    tooltipLines: [`${cat}: ${rec.n} posting${rec.n>1?'s':''}`, payLine, `Needs approval: ${rec.n_yes} yes / ${rec.n_no} no`],
    detail: `<div class="cols">
        <div>
          <div class="col-title yes">Needs leadership approval (${rec.n_yes})</div>
          ${acctListSimple(rec.yes_accts)}
        </div>
        <div>
          <div class="col-title no">No approval needed (${rec.n_no})</div>
          ${acctListSimple(rec.no_accts)}
        </div>
      </div>`
  };
}
function acctListSimple(accts){
  if(!accts.length) return '<span class="none">none</span>';
  return accts.map(a=>`<div class="acct">${a}</div>`).join('');
}
function swiftAccountRows(cat, state){
  const rec = SWIFT_DATA[cat][state];
  if(!rec) return [];
  const pay = `${money(rec.avg_low)}–${money(rec.avg_high)}/wk (true max ${money(rec.max_high)})`;
  const rows = [];
  rec.yes_accts.forEach(name=> rows.push({ account:name, approval:'Yes', pay, hometime:'', notes:'' }));
  rec.no_accts.forEach(name=> rows.push({ account:name, approval:'No', pay, hometime:'', notes:'' }));
  if(!rows.length) rows.push({ account:'(no individual accounts listed)', approval:'—', pay, hometime:'', notes:`${rec.n} posting(s) total` });
  return rows;
}

/* ---- USX ---- */
function usxCpmTable(cpmArr){
  return `<table class="cpm"><tr><th>Tenure</th><th>CPM</th></tr>${cpmArr.map(([t,v])=>`<tr><td>${t}</td><td>$${v.toFixed(2)}</td></tr>`).join('')}</table>`;
}
function usxState(cat, state){
  if(cat==='OTR Solo Company'){
    const region = USX_STATE_REGION[state];
    if(!region) return null;
    const r = USX_OTR_SOLO_REGIONS[region];
    const top = r.cpm[r.cpm.length-1][1];
    return {
      value: top,
      tooltipLines: [`OTR Solo Company — ${region} region`, `CPM range: $${r.cpm[0][1].toFixed(2)} – $${top.toFixed(2)}`, `+ loyalty pay up to $0.06/mi at 48mo+`],
      detail: `<div><b>${region} region</b> — pay is region-based, not per-terminal.</div>
        ${usxCpmTable(r.cpm)}
        <div style="margin-top:8px"><b>Loyalty pay adder (stacks on base CPM):</b></div>
        <table class="cpm"><tr><th>USX tenure</th><th>Adder</th></tr>${r.cpm===r.cpm?USX_LOYALTY.map(([t,v])=>`<tr><td>${t}</td><td>${v}</td></tr>`).join(''):''}</table>
        <div style="margin-top:8px"><b>Minimum short-haul pay</b> (pickup/delivery to customer locations, excludes terminal transfers):</div>
        <table class="cpm"><tr><th>Miles</th><th>Min pay</th></tr>${USX_SHORTHAUL.map(([t,v])=>`<tr><td>${t}</td><td>${v}</td></tr>`).join('')}</table>
        <div class="none" style="margin-top:6px">Montana and North Dakota are not in any of the 5 CPM regions and are excluded from OTR Solo pay zones.</div>`
    };
  }
  if(cat==='OTR Team Company'){
    if(!LOWER_48.includes(state)) return null;
    return {
      value: null,
      flatNo: false,
      tooltipLines: [`OTR Team Company — drive across all 48 states`, `$10,000 split sign-on bonus (team)`, `No published base pay rate captured`],
      detail: `<div class="card"><h3>${state} — OTR Team Company</h3>
        <p>Coverage-only listing: "Drive Across All 48 States." $10,000 split sign-on bonus (team). No specific CPM/weekly pay figure was captured from the source data — confirm with USX before quoting to a driver.</p></div>`
    };
  }
  if(cat==='OTR Regional'){
    const ne = USX_OTR_REGIONAL.northeast;
    if(!ne.states.includes(state)) return null;
    const top = ne.cpm[ne.cpm.length-1][1];
    return {
      value: top,
      tooltipLines: [`OTR Regional — Northeast sub-fleet (approx.)`, `CPM range: $${ne.cpm[0][1].toFixed(2)} – $${top.toFixed(2)}`, `Top 20% earn $1,700+/wk`],
      detail: `<div><b>Northeast sub-fleet</b> — ${ne.note}</div>
        ${usxCpmTable(ne.cpm)}

/* ---- dispatcher ---- */
function getStateRecord(carrierId, cat, state){
  if(carrierId==='swift') return swiftState(cat,state);
  if(carrierId==='usx') return usxState(cat,state);
  if(carrierId==='pam') return pamState(cat,state);
  if(carrierId==='transam') return transamState(cat,state);
  if(carrierId==='cre') return creState(cat,state);
  return null;
}
function getStateAccountRows(carrierId, cat, state){
  if(carrierId==='swift') return swiftAccountRows(cat,state);
  if(carrierId==='usx') return usxAccountRows(cat,state);
  if(carrierId==='pam') return pamAccountRows(cat,state);
  if(carrierId==='transam') return transamAccountRows(cat,state);
  if(carrierId==='cre') return creAccountRows(cat,state);
  return [];
}
function carrierSummaryLines(carrierId, state){
  const cats = CARRIERS[carrierId].cats;

}

const DEFAULT_RECRUITERS = ["Ron","William","Kevin","James","Lucas","Michael","Jason","Jordan","Alex","Cris","Nolan","Frank","Kate","Lewis","Daniel","Brian","Brandon","Tyler","Mark","Ethan","Jack"];
function loadRecruiters(){
  try {
    const saved = JSON.parse(localStorage.getItem('cdlPayMapRecruiters') || 'null');
    if(Array.isArray(saved) && saved.length) return saved;
  } catch(e){}
  return DEFAULT_RECRUITERS.slice();
}

const RECRUITER_TARGET = 5;
function buildRecruiterPalette(n){
  const base = d3.schemeTableau10.concat(d3.schemeSet3);
  const out = [];
  for(let i=0;i<n;i++) out.push(base[i % base.length]);
  return out;
}
let RECRUITER_PALETTE = buildRecruiterPalette(RECRUITERS.length);
let recruiterColor = d3.scaleOrdinal().domain(RECRUITERS).range(RECRUITER_PALETTE);
function rebuildRecruiterColor(){
  RECRUITER_PALETTE = buildRecruiterPalette(RECRUITERS.length);
  recruiterColor = d3.scaleOrdinal().domain(RECRUITERS).range(RECRUITER_PALETTE);
}
function addRecruiterName(name){
  name = (name||'').trim();
  if(!name) return 'Enter a recruiter name.';
  if(RECRUITERS.some(r=>r.toLowerCase()===name.toLowerCase())) return 'That recruiter already exists.';
  RECRUITERS.push(name);
  saveRecruiters();
  rebuildRecruiterColor();
  return null;
}
function removeRecruiterName(name){
  RECRUITERS = RECRUITERS.filter(r=>r!==name);
  saveRecruiters();
  rebuildRecruiterColor();
  // scrub the removed recruiter out of any state assignments
  Object.keys(RECRUITER_ASSIGNMENTS).forEach(state=>{
    const arr = (RECRUITER_ASSIGNMENTS[state]||[]).filter(r=>r!==name);
    if(arr.length) RECRUITER_ASSIGNMENTS[state] = arr; else delete RECRUITER_ASSIGNMENTS[state];
  });
  saveRecruiterAssignments();
  if(recruiterFilter === name) recruiterFilter = '';
}
let RECRUITER_ASSIGNMENTS = {}; // state -> array of recruiter names (a state can be shared by more than one recruiter)
try { RECRUITER_ASSIGNMENTS = JSON.parse(localStorage.getItem('cdlPayMapRecruiterAssignments') || '{}'); } catch(e){ RECRUITER_ASSIGNMENTS = {}; }
// Migrate old single-recruiter-per-state format (plain string) to array format.
Object.keys(RECRUITER_ASSIGNMENTS).forEach(s=>{
  if(typeof RECRUITER_ASSIGNMENTS[s] === 'string') RECRUITER_ASSIGNMENTS[s] = [RECRUITER_ASSIGNMENTS[s]];
  if(!Array.isArray(RECRUITER_ASSIGNMENTS[s]) || !RECRUITER_ASSIGNMENTS[s].length) delete RECRUITER_ASSIGNMENTS[s];
});
function saveRecruiterAssignments(){ localStorage.setItem('cdlPayMapRecruiterAssignments', JSON.stringify(RECRUITER_ASSIGNMENTS)); }
function toggleRecruiterOnState(state, recruiter){
  const arr = RECRUITER_ASSIGNMENTS[state] ? RECRUITER_ASSIGNMENTS[state].slice() : [];
  const idx = arr.indexOf(recruiter);
  if(idx === -1) arr.push(recruiter); else arr.splice(idx,1);
  if(arr.length) RECRUITER_ASSIGNMENTS[state] = arr; else delete RECRUITER_ASSIGNMENTS[state];
  saveRecruiterAssignments();
}

function renderRecruiterManage(){
  recruiterManageEl.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'rmHeader';

  title.className = 'rmTitle';
  title.textContent = 'Recruiters';
  const hint = document.createElement('span');
  hint.className = 'rmHint';
  hint.textContent = "Add new hires or remove recruiters who've left — updates the map + report instantly.";
  header.appendChild(title);
  header.appendChild(hint);
  recruiterManageEl.appendChild(header);

  const chipsRow = document.createElement('div');
  chipsRow.className = 'rmChips';
  RECRUITERS.forEach(r=>{
    const chip = document.createElement('span');
    chip.className = 'rmChip';
    chip.innerHTML = `<span class="dot" style="background:${recruiterColor(r)}"></span>${r}`;
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'rmRemove';
    rm.textContent = '✕';
    rm.title = `Remove ${r}`;
    rm.onclick = () => {

      removeRecruiterName(r);
      renderRecruiterManage();
      renderRecruiterPanel();
      renderRecruiterReport();
      updateMap();
    };

    chipsRow.appendChild(chip);
  });

  const addRow = document.createElement('div');
  addRow.className = 'rmAddRow';

  addBtn.type = 'button';
  addBtn.className = 'rmAddBtn';
  addBtn.textContent = '+ Add recruiter';
  const err = document.createElement('span');
  err.className = 'rmErr';
  const doAdd = () => {
    const problem = addRecruiterName(input.value);
    if(problem){ err.textContent = problem; return; }
    input.value = '';
    err.textContent = '';
    renderRecruiterManage();
    renderRecruiterPanel();
    updateMap();
  };
  addBtn.onclick = doAdd;
  input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  addRow.appendChild(err);
  recruiterManageEl.appendChild(addRow);
}

function renderRecruiterReport(){
  if(!strategyMode || !recruiterFilter){ recruiterReportEl.style.display='none'; recruiterReportEl.innerHTML=''; return; }

  const stateBlocks = states.map(state=>{

  }).join('');
  recruiterReportEl.innerHTML = `<h2>${recruiterFilter} — full report (${states.length} state${states.length>1?'s':''}) <button id="exportRecruiterBtn" class="exportBtn">⬇ Export to Excel</button></h2>${stateBlocks}`;
  document.getElementById('exportRecruiterBtn').onclick = exportRecruiterReportToExcel;
}
function exportRecruiterReportToExcel(){
  if(!recruiterFilter) return;
  const states = Object.keys(RECRUITER_ASSIGNMENTS).filter(s=>(RECRUITER_ASSIGNMENTS[s]||[]).includes(recruiterFilter)).sort();
  const rows = [];
  states.forEach(state=>{
    const assignedId = ASSIGNMENTS[state];
    const assignedLabel = assignedId ? CARRIERS[assignedId].label : '(unassigned)';
    const sharedWith = (RECRUITER_ASSIGNMENTS[state]||[]).filter(r=>r!==recruiterFilter).join(', ');
    let anyForState = false;
    CARRIER_ORDER.forEach(id=>{
      CARRIERS[id].cats.forEach(cat=>{
        const acctRows = getStateAccountRows(id, cat, state);
        if(!acctRows.length) return;
        anyForState = true;
        acctRows.forEach(a=>{
          rows.push({
            State: state,
            Recruiter: recruiterFilter,
            'Shared With': sharedWith,
            'Assigned Carrier': assignedLabel,
            Carrier: CARRIERS[id].label,
            'Assigned?': id===assignedId ? 'Yes' : '',
            Category: cat,
            Account: a.account,
            'Approval Needed': a.approval,
            Pay: a.pay,
            'Home Time': a.hometime,
            Notes: a.notes
          });
        });
      });
    });
    if(!anyForState){
      rows.push({ State: state, Recruiter: recruiterFilter, 'Shared With': sharedWith, 'Assigned Carrier': assignedLabel, Carrier:'', 'Assigned?':'', Category:'', Account:'', 'Approval Needed':'', Pay:'No carrier data available for this state.', 'Home Time':'', Notes:'' });
    }
  });
  if(!rows.length){ alert(`No assigned states to export for ${recruiterFilter}.`); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:12},{wch:16},{wch:16},{wch:14},{wch:9},{wch:24},{wch:34},{wch:15},{wch:44},{wch:24},{wch:60}];
  ws['!autofilter'] = { ref: ws['!ref'] };
  ws['!views'] = [{ state:'frozen', ySplit:1 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, recruiterFilter.slice(0,31));
  XLSX.writeFile(wb, `${recruiterFilter.replace(/[^a-z0-9]+/gi,'_')}_assigned_states.xlsx`);
}

renderCarrierTabs();
renderCatTabs();

/* ================= MAP ================= */
const svg = d3.select('#map').append('svg').attr('viewBox','0 0 975 610').attr('width','100%').attr('height','auto');
const defs = svg.append('defs');
const g = svg.append('g');
const labelG = svg.append('g').attr('class','stateLabelsGroup');

function recruiterGradId(names){
  return 'grad-' + names.slice().sort().map(n=>n.replace(/[^a-z0-9]/gi,'')).join('-');
}
function ensureRecruiterGradients(){
  const combos = new Map();
  Object.keys(RECRUITER_ASSIGNMENTS).forEach(state=>{
    const arr = RECRUITER_ASSIGNMENTS[state] || [];
    if(arr.length > 1){
      const sorted = arr.slice().sort();
      combos.set(recruiterGradId(sorted), sorted);
    }
  });
  defs.selectAll('linearGradient').remove();
  combos.forEach((names, id)=>{
    const grad = defs.append('linearGradient').attr('id', id).attr('x1','0%').attr('y1','0%').attr('x2','100%').attr('y2','100%');
    const n = names.length;
    names.forEach((name, i)=>{
      grad.append('stop').attr('offset', ((i/n)*100)+'%').attr('stop-color', recruiterColor(name));
      grad.append('stop').attr('offset', (((i+1)/n)*100)+'%').attr('stop-color', recruiterColor(name));
    });
  });
}
const path = d3.geoPath();
let statePaths;
let US_FEATURES = null;

d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json').then(us=>{
  const features = topojson.feature(us, us.objects.states).features;
  US_FEATURES = features;
  statePaths = g.selectAll('path').data(features).join('path')
    .attr('d', path)
    .on('mousemove', function(event, d){
      const name = d.properties.name;
      const tip = document.getElementById('tip');
      let html = '';
      if(strategyMode){
        const assigned = ASSIGNMENTS[name];
        const recruiters = RECRUITER_ASSIGNMENTS[name] || [];
        html = `<div style="font-weight:600;margin-bottom:4px">${name}</div>`+
          `<div>Carrier: ${assigned ? CARRIERS[assigned].label : '— unassigned —'}</div>`+
          `<div>Recruiter${recruiters.length>1?'s':''}: ${recruiters.length ? recruiters.join(', ') : '— unassigned —'}</div>`+
          `<div style="margin-top:2px;color:#2a78d6">Click to assign / see all carriers</div>`;
      } else {
        const rec = getStateRecord(currentCarrier, currentCat, name);
        if(!rec){ tip.style.display='none'; return; }
        html = `<div style="font-weight:600;margin-bottom:4px">${name} — ${CARRIERS[currentCarrier].label}</div>`+
          rec.tooltipLines.map(l=>`<div>${l}</div>`).join('')+
          `<div style="margin-top:4px;color:#2a78d6">Click for details</div>`;
      }
      tip.style.display='block';
      tip.style.left = (event.clientX+14)+'px';
      tip.style.top = (event.clientY+14)+'px';
      tip.innerHTML = html;
    })
    .on('mouseleave', function(){ document.getElementById('tip').style.display='none'; })
    .on('click', function(event, d){
      const name = d.properties.name;
      if(!strategyMode && !getStateRecord(currentCarrier, currentCat, name)) return;
      selectedState = name;
      renderDetail();
    });
  updateMap();
});

function stateLabelText(d){
  const arr = RECRUITER_ASSIGNMENTS[d.properties.name] || [];
  const shown = recruiterFilter ? [recruiterFilter] : arr;
  return shown.length <= 2 ? shown.join(', ') : `${shown[0]} +${shown.length-1}`;
}
function rectsOverlap(a, b){
  const pad = 2; // small buffer so labels get breathing room, not just touching
  return !(a.x2+pad < b.x1 || b.x2+pad < a.x1 || a.y2+pad < b.y1 || b.y2+pad < a.y1);
}
function estimateLabelBox(cx, cy, label){
  const w = Math.max(18, label.length*5.5 + 12);
  const h = 15;
  return { x1:cx-w/2, y1:cy-h/2, x2:cx+w/2, y2:cy+h/2 };
}
function renderStateLabels(){
  if(!US_FEATURES) return;
  const nodes = US_FEATURES.filter(d=>{
    const arr = RECRUITER_ASSIGNMENTS[d.properties.name] || [];
    if(!arr.length) return false;
    if(recruiterFilter) return arr.includes(recruiterFilter);
    return true;
  });
  // Bigger states get first pick of label space, so small crowded states (New England etc.)
  // are the ones that drop their label when there isn't room — not the other way around.
  nodes.sort((a,b) => path.area(b) - path.area(a));

  const placed = [];
  const toRender = [];
  nodes.forEach(d=>{
    const c = path.centroid(d);
    const label = stateLabelText(d);
    const box = estimateLabelBox(c[0], c[1], label);
    if(placed.some(p => rectsOverlap(p, box))) return; // would collide — skip, fill color + tooltip still show it
    placed.push(box);
    toRender.push({ key: d.properties.name, c, label });
  });

  const groups = labelG.selectAll('g.stateLabelG')
    .data(toRender, x=>x.key)
    .join('g')
    .attr('class','stateLabelG')
    .attr('transform', x=>`translate(${x.c[0]},${x.c[1]})`);

  groups.selectAll('*').remove();
  groups.each(function(x){
    const grp = d3.select(this);
    const text = grp.append('text')
      .attr('class','stateLabelText')
      .attr('text-anchor','middle')
      .attr('dy','0.32em')
      .text(x.label);
    let bbox;
    try { bbox = text.node().getBBox(); }
    catch(e){ const w = x.label.length*5.4; bbox = { x:-w/2, y:-5, width:w, height:10 }; }
    grp.insert('rect','text')
      .attr('class','stateLabelBg')
      .attr('x', bbox.x-4)
      .attr('y', bbox.y-2)
      .attr('width', bbox.width+8)
      .attr('height', bbox.height+4)
      .attr('rx', 6);
  });
}

function updateMap(){
  if(!statePaths) return;
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  labelG.selectAll('text').remove();

  if(strategyMode){
    if(colorMode==='recruiter'){
      ensureRecruiterGradients();
      statePaths
        .style('cursor','pointer')
        .style('stroke', d => (RECRUITER_ASSIGNMENTS[d.properties.name]||[]).length > 1 ? '#1a1a1a' : '#c7c7c2')
        .style('stroke-width', d => (RECRUITER_ASSIGNMENTS[d.properties.name]||[]).length > 1 ? 1.6 : 0.75)
        .attr('fill', d => {
          const arr = RECRUITER_ASSIGNMENTS[d.properties.name] || [];
          if(!arr.length) return '#f0efec';
          if(recruiterFilter) return arr.includes(recruiterFilter) ? recruiterColor(recruiterFilter) : '#e3e2de';
          if(arr.length > 1) return `url(#${recruiterGradId(arr)})`;
          return recruiterColor(arr[0]);
        })
        .attr('opacity', d => {
          if(!recruiterFilter) return 1;
          const arr = RECRUITER_ASSIGNMENTS[d.properties.name] || [];
          return arr.includes(recruiterFilter) ? 1 : 0.4;
        });
      renderStateLabels();
      if(recruiterFilter){
        const dot = document.createElement('span');
        dot.style.cssText = `display:inline-flex;align-items:center;gap:4px;`;
        dot.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${recruiterColor(recruiterFilter)};display:inline-block"></span>${recruiterFilter}`;
        legend.appendChild(dot);
        const other = document.createElement('span');
        other.style.marginLeft = '10px';
        other.textContent = 'dimmed = other recruiters / unassigned · thick border = shared with another recruiter';
        legend.appendChild(other);
      } else {
        RECRUITERS.forEach(r=>{
          const dot = document.createElement('span');
          dot.style.cssText = `display:inline-flex;align-items:center;gap:4px;`;
          dot.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${recruiterColor(r)};display:inline-block"></span>${r}`;
          legend.appendChild(dot);
        });
        const un = document.createElement('span');
        un.style.marginLeft = '10px';
        un.textContent = 'gray = unassigned · split color + thick border = shared between recruiters';
        legend.appendChild(un);
      }
      return;
    }
    statePaths
      .style('cursor','pointer')
      .style('stroke', '#c7c7c2')
      .style('stroke-width', 0.75)
      .attr('fill', d => { const a = ASSIGNMENTS[d.properties.name]; return a ? CARRIERS[a].color : '#f0efec'; })
      .attr('opacity', 1);
    CARRIER_ORDER.forEach(id=>{
      const dot = document.createElement('span');
      dot.style.cssText = `display:inline-flex;align-items:center;gap:4px;`;
      dot.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${CARRIERS[id].color};display:inline-block"></span>${CARRIERS[id].label}`;
      legend.appendChild(dot);
    });
    const un = document.createElement('span');
    un.style.marginLeft = '10px';
    un.textContent = 'gray = unassigned';
    legend.appendChild(un);
    return;
  }

  const flat = isFlatCategory(currentCarrier, currentCat);
  if(flat){
    statePaths
      .style('cursor', d => getStateRecord(currentCarrier,currentCat,d.properties.name) ? 'pointer' : 'default')
      .style('stroke', '#c7c7c2')
      .style('stroke-width', 0.75)
      .attr('fill', d=>{
        const rec = getStateRecord(currentCarrier,currentCat,d.properties.name);
        if(!rec) return '#f0efec';
        return rec.flatNo ? '#f4c7c3' : CARRIERS[currentCarrier].color;
      }).attr('opacity', d => getStateRecord(currentCarrier,currentCat,d.properties.name) ? 1 : 0.35);
    const l1 = document.createElement('span'); l1.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${CARRIERS[currentCarrier].color};display:inline-block;margin-right:4px"></span>hires here`;
    const l2 = document.createElement('span'); l2.style.marginLeft='12px'; l2.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:#f4c7c3;display:inline-block;margin-right:4px"></span>does not hire`;
    const l3 = document.createElement('span'); l3.style.marginLeft='12px'; l3.textContent = 'gray = no data';
    legend.append(l1,l2,l3);
    return;
  }

  const vals = [];
  ALL_STATES.forEach(s=>{ const rec = getStateRecord(currentCarrier,currentCat,s); if(rec && rec.value!=null) vals.push(rec.value); });
  const min = vals.length ? d3.min(vals) : 0, max = vals.length ? d3.max(vals) : 1;
  const color = d3.scaleSequential(d3.interpolateBlues).domain([min*0.9 || 0, max*1.05 || 1]);

  statePaths
    .style('cursor', d => getStateRecord(currentCarrier,currentCat,d.properties.name) ? 'pointer' : 'default')
    .style('stroke', '#c7c7c2')
    .style('stroke-width', 0.75)
    .attr('fill', d=>{
      const rec = getStateRecord(currentCarrier,currentCat,d.properties.name);
      if(!rec) return '#f0efec';
      if(rec.value==null) return '#b9c9dc';
      return color(rec.value);
    }).attr('opacity', d=> getStateRecord(currentCarrier,currentCat,d.properties.name) ? 1 : 0.35);

  const label1 = document.createElement('span'); label1.textContent = vals.length ? `${currentCarrier==='swift'?'$'+min.toLocaleString():'$'+min.toFixed(2)}${currentCarrier==='swift'?'/wk':'/mi'}` : 'n/a';
  const bar = document.createElement('div');
  bar.style.cssText = `width:140px;height:10px;border-radius:4px;background:linear-gradient(to right, ${color(min*0.9||0)}, ${color(max*1.05||1)})`;
  const label2 = document.createElement('span'); label2.textContent = vals.length ? `${currentCarrier==='swift'?'$'+max.toLocaleString():'$'+max.toFixed(2)}${currentCarrier==='swift'?'/wk':'/mi'}` : '';
  const label3 = document.createElement('span'); label3.style.marginLeft='16px'; label3.textContent = 'gray = no data for this category';
  const label4 = document.createElement('span'); label4.style.marginLeft='16px'; label4.textContent = 'darker = higher pay · click a state for details';
  legend.append(label1, bar, label2, label3, label4);
}

/* ================= DETAIL / ASSIGNMENT ================= */
function assignedBadge(state){
  const a = ASSIGNMENTS[state];
  if(!a) return `<span class="assignBadge" style="background:#999">unassigned</span>`;
  return `<span class="assignBadge" style="background:${CARRIERS[a].color}">${CARRIERS[a].label}</span>`;
}
function recruiterBadge(state){
  const arr = RECRUITER_ASSIGNMENTS[state] || [];
  if(!arr.length) return `<span class="assignBadge" style="background:#999">no recruiter</span>`;
  return arr.map(r=>`<span class="assignBadge" style="background:${recruiterColor(r)}">${r}</span>`).join(' ');
}
function renderDetail(){
  const el = document.getElementById('detail');
  if(!selectedState){ el.innerHTML=''; return; }

  if(strategyMode){
    const opts = ['<option value="">— Unassigned —</option>']
      .concat(CARRIER_ORDER.map(id=>`<option value="${id}" ${ASSIGNMENTS[selectedState]===id?'selected':''}>${CARRIERS[id].label}</option>`));
    const selectedRecruiters = RECRUITER_ASSIGNMENTS[selectedState] || [];
    const recruiterChips = RECRUITERS.map(r=>{
      const on = selectedRecruiters.includes(r);
      return `<span class="achip${on?' selected':''}" data-recruiter="${r}" style="${on?`background:${recruiterColor(r)};border-color:${recruiterColor(r)}`:''}">${r}</span>`;
    }).join('');
    const summaries = CARRIER_ORDER.map(id=>{
      const lines = carrierSummaryLines(id, selectedState);
      return `<div class="line"><span class="cname" style="color:${CARRIERS[id].color}">${CARRIERS[id].label}:</span> ${lines.length? lines.join(' &nbsp;·&nbsp; ') : '<span class="none">no data for this state</span>'}</div>`;
    }).join('');
    el.innerHTML = `<div class="card">
      <h3>${selectedState} <span class="meta">strategy assignment</span> ${assignedBadge(selectedState)} ${recruiterBadge(selectedState)}</h3>
      <div class="assignRow">
        <label>Carrier:</label>
        <select id="assignSelect">${opts.join('')}</select>
      </div>
      <div class="assignRow">
        <label>Recruiter(s):</label>
        <div class="assignChips">${recruiterChips}</div>
      </div>
      <div class="cross">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#666">Quick reference — what each carrier offers here</div>
        ${summaries}
      </div>
    </div>`;
    document.getElementById('assignSelect').onchange = (e)=>{
      const v = e.target.value;
      if(v) ASSIGNMENTS[selectedState] = v; else delete ASSIGNMENTS[selectedState];
      saveAssignments();
      updateMap();
      renderDetail();
      renderRecruiterReport();
    };
    el.querySelectorAll('.assignChips .achip').forEach(chip=>{
      chip.onclick = ()=>{
        toggleRecruiterOnState(selectedState, chip.getAttribute('data-recruiter'));
        renderRecruiterPanel();
        updateMap();
        renderDetail();
        renderRecruiterReport();
      };
    });
    return;
  }

  const rec = getStateRecord(currentCarrier, currentCat, selectedState);
  if(!rec){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="card">
      <h3>${selectedState} — ${CARRIERS[currentCarrier].label} · ${currentCat} ${assignedBadge(selectedState)}</h3>
      ${rec.detail}
    </div>`;
}
